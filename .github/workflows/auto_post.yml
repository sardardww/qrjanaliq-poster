name: "@qaraqalpaqshajanaliqlar Auto News Poster (Every 15 min / 4x per hour)"

on:
  schedule:
    # Runs strictly every 15 minutes (:02, :17, :32, :47)
    # Active only from 04:00 to 00:00 (midnight) Tashkent time (UTC+5)
    # Quiet hours (everyone sleeping): 00:00 to 04:00 Tashkent time (19:00 to 23:00 UTC)
    # Active UTC hours: 23 (04:00 UZT) and 0-18 (05:00 - 23:59 UZT)
    - cron: "2,17,32,47 0-18,23 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Nechta post chiqarilsin (1-4)"
        required: false
        default: "1"

permissions:
  contents: read
  actions: write

concurrency:
  group: qrjanaliq-poster
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record start time
        run: echo "START_TS=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore posted history cache
        uses: actions/cache@v4
        with:
          path: posted_history.json
          key: qrjanaliq-history-${{ github.run_id }}
          restore-keys: |
            qrjanaliq-history-

      - name: Run Karakalpak AI News Poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_POSTS: ${{ github.event.inputs.max_posts || '1' }}
        run: python cloud_poster.py

      # Self-chain: wait until 15 minutes after this run started, then dispatch next run.
      # Automatically stops self-chaining when entering quiet sleep hours (00:00 - 04:00 Tashkent time).
      - name: Chain next run in 15 minutes
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ELAPSED=$(( $(date +%s) - START_TS ))
          WAIT=$(( 900 - ELAPSED ))
          if [ $WAIT -gt 0 ]; then
            echo "Waiting ${WAIT}s to reach exactly 15-minute cadence..."
            sleep $WAIT
          fi

          # Check if the next run falls into quiet sleep hours (00:00 to 04:00 Tashkent time)
          NEXT_UZT_HOUR=$(TZ="Asia/Tashkent" date +%-H)
          echo "Current Tashkent time: $(TZ="Asia/Tashkent" date '+%Y-%m-%d %H:%M:%S') (Hour: $NEXT_UZT_HOUR)"

          if [ "$NEXT_UZT_HOUR" -lt 4 ]; then
            echo "[QUIET SLEEP HOURS] Current Tashkent hour ($NEXT_UZT_HOUR:00) is during sleep time (00:00 - 04:00)."
            echo "Stopping 15-minute self-chain. Scheduled cron will automatically resume at 04:00 Tashkent time."
            exit 0
          fi

          for i in 1 2 3; do
            echo "Dispatching next run (attempt $i)..."
            if gh workflow run auto_post.yml --ref main --repo ${{ github.repository }}; then
              echo "Next run dispatched successfully!"
              exit 0
            fi
            sleep 5
          done
          echo "Warning: Self-chain dispatch had an issue, fallback to scheduled cron."
