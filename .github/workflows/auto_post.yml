name: "@qaraqalpaqshajanaliqlar Auto News Poster (Every 10 min / 6x per hour)"

on:
  schedule:
    # Runs 6 TIMES EVERY HOUR (strictly every 10 minutes: :02, :12, :22, :32, :42, :52)
    # 10-minute cadence keeps Render translation API warm 24/7 (never sleeps!)
    # Between 04:00 and 00:00 Tashkent time (UTC+5)
    # 23:02..23:52 UTC = 04:02..04:52 UZT | 00:02..19:52 UTC = 05:02..00:52 UZT
    - cron: "2,12,22,32,42,52 0-19,23 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Nechta post chiqarilsin (1-4)"
        required: false
        default: "1"

permissions:
  contents: read
  actions: write

concurrency:
  group: qrjanaliq-poster
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record start time
        run: echo "START_TS=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore posted history cache
        uses: actions/cache@v4
        with:
          path: posted_history.json
          key: qrjanaliq-history-${{ github.run_id }}
          restore-keys: |
            qrjanaliq-history-

      - name: Run Karakalpak AI News Poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_POSTS: ${{ github.event.inputs.max_posts || '1' }}
        run: python cloud_poster.py

      # GitHub cron is best-effort and often skips runs. Self-chain: wait until
      # 10 minutes after this run started, then dispatch the next run.
      - name: Chain next run in 10 minutes
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ELAPSED=$(( $(date +%s) - START_TS ))
          WAIT=$(( 600 - ELAPSED ))
          if [ $WAIT -gt 0 ]; then
            echo "Waiting ${WAIT}s to reach exactly 10-minute cadence..."
            sleep $WAIT
          fi
          for i in 1 2 3; do
            echo "Dispatching next run (attempt $i)..."
            if gh workflow run auto_post.yml --ref main --repo ${{ github.repository }}; then
              echo "Next run dispatched successfully!"
              exit 0
            fi
            sleep 5
          done
          echo "Warning: Self-chain dispatch had an issue, fallback to scheduled cron."
