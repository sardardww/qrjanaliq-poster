name: "@qrjanaliq Hourly Auto News Poster (04:00-00:00)"

on:
  schedule:
    # Runs EVERY HOUR between 04:00 and 00:00 Tashkent time (UTC+5) -> 21 runs/day
    # 23:05 UTC = 04:05 UZT | 00:05..19:05 UTC = 05:05..00:05 UZT (sleeps 01:00-03:59 UZT)
    - cron: "5 0-19,23 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Nechta post chiqarilsin (1-4)"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: qrjanaliq-poster
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore posted history cache
        uses: actions/cache@v4
        with:
          path: posted_history.json
          key: qrjanaliq-history-${{ github.run_id }}
          restore-keys: |
            qrjanaliq-history-

      - name: Run Karakalpak AI News Poster (Hourly)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_POSTS: ${{ github.event.inputs.max_posts || '2' }}
        run: python cloud_poster.py
