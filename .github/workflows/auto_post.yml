name: Avtomat Grant Yangilaw

on:
  schedule:
    # Hár kúni saat 10:00 da (Toshkent/Nukus waqtı menen UTC 05:00 da)
    - cron: '0 5 * * *'
  workflow_dispatch: # Qolda "Run workflow" túymesin basıp isletiw ushın

permissions:
  contents: write

jobs:
  update-grants:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriy kodin júklep alıw
        uses: actions/checkout@v4

      - name: Python sazlaw
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gemini AI arqalı jańa grant generatsiya qılıw
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_grant.py

      - name: Ózgerislerdi GitHub-qa saqlaw (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/grants.json
          git diff-index --quiet HEAD || (git commit -m "Avtomat: Jańa grant qosıldı [Gemini AI]" && git push)
