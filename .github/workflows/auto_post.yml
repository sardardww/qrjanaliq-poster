name: "@qaraqalpaqshajanaliqlar Auto News Poster (Every 15 min / 4x per hour)"

on:
  schedule:
    # Runs strictly every 15 minutes (:02, :17, :32, :47)
    # Active only from 04:00 to 00:00 (midnight) Tashkent time (UTC+5)
    # Quiet hours (everyone sleeping): 00:00 to 04:00 Tashkent time (19:00 to 23:00 UTC)
    # Active UTC hours: 23 (04:00 UZT) and 0-18 (05:00 - 23:59 UZT)
    - cron: "2,17,32,47 0-18,23 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Nechta post chiqarilsin (1-4)"
        required: false
        default: "3"

permissions:
  contents: write
  actions: write

concurrency:
  group: qrjanaliq-poster
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record start time
        run: echo "START_TS=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore posted history cache
        uses: actions/cache@v4
        with:
          path: posted_history.json
          key: qrjanaliq-history-${{ github.run_id }}
          restore-keys: |
            qrjanaliq-history-

      - name: Run Karakalpak AI News Poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_POSTS: ${{ github.event.inputs.max_posts || '3' }}
        run: python cloud_poster.py

      - name: Execution Summary
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - START_TS ))
          echo "Run completed in ${ELAPSED}s. Scheduled cron will trigger next run strictly every 15 minutes (:02, :17, :32, :47)."
