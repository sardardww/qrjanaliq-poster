name: "@qaraqalpaqshajanaliqlar Auto News Poster (Every 15 min / 4x per hour)"

on:
  schedule:
    # Soatiga 4 marta: :00, :15, :30, :45 daqiqalarda (Toshkent vaqti 04:00 dan 00:00 gacha)
    - cron: "0,15,30,45 0-19,23 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Nechta post chiqarilsin (1-4)"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: qrjanaliq-poster
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore posted history cache
        uses: actions/cache@v4
        with:
          path: posted_history.json
          key: qrjanaliq-history-${{ github.run_id }}
          restore-keys: |
            qrjanaliq-history-

      - name: Run Karakalpak AI News Poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_POSTS: ${{ github.event.inputs.max_posts || '1' }}
        run: python cloud_poster.py
